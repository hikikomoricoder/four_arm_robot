# Default (zero) pose for standalone RViz debugging via display.launch.xml.
#
# Only movable, non-mimic joints are listed. gripper_right_finger_joint is a
# mimic of gripper_left_finger_joint, so it is computed automatically and must
# not be set here. Fixed joints are omitted.
#
# Copy this file (e.g. config/poses/my_pose.yaml), edit the values, then:
#   ros2 launch my_robot_description display.launch.xml pose_file:=.../my_pose.yaml
joints:
  # Steering (veer) joints, one per arm base
  arm_veer_joint_1: 0.0
  arm_veer_joint_2: 0.0
  arm_veer_joint_3: 0.0
  arm_veer_joint_4: 0.0

  # Arm 1
  arm_joint_1_1: 0.0
  arm_joint_3_1: 0.0
  arm_joint_5_1: 0.0
  arm_joint_7_1: 0.0

  # Arm 2
  arm_joint_1_2: 0.0
  arm_joint_3_2: 0.0
  arm_joint_5_2: 0.0
  arm_joint_7_2: 0.0

  # Arm 3
  arm_joint_1_3: 0.0
  arm_joint_3_3: 0.0
  arm_joint_5_3: 0.0
  arm_joint_7_3: 0.0

  # Arm 4
  arm_joint_1_4: 0.0
  arm_joint_3_4: 0.0
  arm_joint_5_4: 0.0
  arm_joint_7_4: 0.0

  # Gripper (left finger drives the right one via mimic)
  gripper_left_finger_joint: 0.0

  # Drive wheels
  wheel_joint_1: 0.0
  wheel_joint_2: 0.0
  wheel_joint_3: 0.0
  wheel_joint_4: 0.0
